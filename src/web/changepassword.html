<!DOCTYPE HTML>
<html>
    <head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="zoraxy.csrf.Token" content="{{.csrfToken}}">
    <link rel="icon" type="image/png" href="./favicon.png" />
    <title>Change Password | Zoraxy</title>
    <link rel="stylesheet" href="script/semantic/semantic.min.css">
    <script type="application/javascript" src="script/jquery-3.6.0.min.js"></script>
    <script type="application/javascript" src="script/semantic/semantic.min.js"></script>
    <style>
        body {
            background: rgb(231, 231, 231);
        }
        #loginForm {
            border-radius: 1em;
            width: 25em;
            height: 480px;
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            margin: auto;
            max-width: 100%;
            max-height: 100%;
            overflow: auto;
            background-color: white;
        }
        #errmsg {
            color: #9f3a38;
            margin-top: 1em;
            margin-bottom: 0.4em;
            text-align: left;
        }
    </style>
    </head>
    <body>
        <div id="loginForm" class="ui middle aligned center aligned grid">
            <div class="column" style="padding-top: 0 !important;">
                <form class="ui large form content">
                    <div class="ui basic segment">
                        <img class="ui fluid image" src="img/public/logo.svg" style="pointer-events:none;">
                        <p>Change your password</p>
                        <div class="field">
                            <div class="ui left icon input">
                                <i class="lock icon"></i>
                                <input id="oldMagic" type="password" name="oldPassword" placeholder="Current Password">
                            </div>
                        </div>
                        <div class="field">
                            <div class="ui left icon input">
                                <i class="lock icon"></i>
                                <input id="magic" type="password" name="newPassword" placeholder="New Password">
                            </div>
                        </div>
                        <div class="field">
                            <div class="ui left icon input">
                                <i class="lock icon"></i>
                                <input id="repeatMagic" type="password" name="confirmPassword" placeholder="Confirm New Password">
                            </div>
                        </div>
                        <div id="changebtn" class="ui fluid basic button"><i class="ui blue check icon"></i> Change Password</div>
                        <div id="errmsg"></div>
                    </div>
                </form>
            </div>
        </div>
    <script>
        function getCsrfToken() {
            return document.querySelector('meta[name="zoraxy.csrf.Token"]').getAttribute("content");
        }

        function changePassword() {
            let oldMagic = $("#oldMagic").val();
            let magic = $("#magic").val();
            let repeatMagic = $("#repeatMagic").val();

            if (magic !== repeatMagic) {
                $("#errmsg").html('<i class="red remove icon"></i> New passwords do not match');
                return;
            }
            if (magic === "") {
                $("#errmsg").html('<i class="red remove icon"></i> New password cannot be empty');
                return;
            }

            let csrfToken = getCsrfToken();
            $("#errmsg").html("");
            $("#changebtn").addClass("disabled");
            $.ajax({
                url: "/api/auth/changePassword",
                method: "POST",
                beforeSend: function(request) {
                    request.setRequestHeader("X-CSRF-Token", csrfToken);
                },
                data: {
                    oldPassword: oldMagic,
                    newPassword: magic,
                    confirmPassword: repeatMagic
                },
                success: function(data) {
                    if (data.error !== undefined) {
                        $("#errmsg").html('<i class="red remove icon"></i> ' + data.error);
                        $("#changebtn").removeClass("disabled");
                    } else {
                        //Heslo změněno, pokračuj do management rozhraní
                        window.location.href = "./";
                    }
                },
                error: function() {
                    $("#errmsg").html('<i class="red remove icon"></i> Something went wrong');
                    $("#changebtn").removeClass("disabled");
                }
            });
        }

        $("#changebtn").on("click", function() { changePassword(); });
        $("input").on("keydown", function(event) {
            if (event.keyCode === 13) {
                event.preventDefault();
                if ($(this).attr("id") == "repeatMagic") {
                    changePassword();
                } else {
                    $(this).next().focus();
                }
            }
        });
    </script>
    </body>
</html>
